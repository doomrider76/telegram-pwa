<div id="app">
  <section class="screen" id="screen-list">
    <header class="hdr">
      <button class="icon-btn" id="btn-search-toggle"><svg width="22" height="22"><use href="#i-search"/></svg></button>
      <div class="hdr-title" id="list-title">تلگرام</div>
      <button class="icon-btn" id="btn-menu-list"><svg width="22" height="22"><use href="#i-menu"/></svg></button>
    </header>
    <div class="tab-body" id="tab-chats">
      <div class="searchbar" id="searchbar" style="display:none">
        <input id="search-input" placeholder="جستجو…">
      </div>
      <div class="list" id="chat-list"></div>
    </div>
    <div class="tab-body hidden" id="tab-contacts"><div class="list" id="contacts-list"></div></div>
    <div class="tab-body hidden" id="tab-settings"><div id="settings-body"></div></div>
    <button class="fab" id="fab-new"><svg width="26" height="26"><use href="#i-plus"/></svg></button>
    <nav class="tabbar">
      <button data-tab="chats" class="active"><svg width="24" height="24"><use href="#i-chat"/></svg><span>گفتگوها</span></button>
      <button data-tab="contacts"><svg width="24" height="24"><use href="#i-users"/></svg><span>مخاطبین</span></button>
      <button data-tab="settings"><svg width="24" height="24"><use href="#i-settings"/></svg><span>تنظیمات</span></button>
    </nav>
  </section>

  <section class="screen" id="screen-chat">
    <header class="hdr">
      <button class="icon-btn back-btn" id="btn-back"><svg width="24" height="24"><use href="#i-back"/></svg></button>
      <div class="avatar sm" id="chat-avatar"></div>
      <div class="chat-info">
        <div class="hdr-title" id="chat-name"></div>
        <div id="chat-status"></div>
      </div>
      <button class="icon-btn" id="btn-call"><svg width="21" height="21"><use href="#i-phone"/></svg></button>
      <button class="icon-btn" id="btn-chat-menu"><svg width="21" height="21"><use href="#i-menu"/></svg></button>
    </header>
    <div id="messages"></div>
    <div class="reply-bar" id="reply-bar">
      <div class="rb-bar"></div>
      <div class="rb-body">
        <div class="rb-name" id="rb-name"></div>
        <div class="rb-text" id="rb-text"></div>
      </div>
      <button class="icon-btn" id="rb-close"><svg width="18" height="18"><use href="#i-close"/></svg></button>
    </div>
    <div class="rec-bar" id="rec-bar">
      <span class="rec-dot"></span>
      <span id="rec-time">0:00</span>
      <span class="rec-cancel" id="rec-cancel">برای لغو بکشید</span>
    </div>
    <div class="composer" id="composer">
      <button class="icon-btn" id="btn-attach"><svg width="24" height="24"><use href="#i-attach"/></svg></button>
      <div class="input-wrap"><textarea id="msg-input" rows="1" placeholder="پیام"></textarea></div>
      <button class="icon-btn" id="btn-emoji"><svg width="24" height="24"><use href="#i-smile"/></svg></button>
      <button class="send-btn" id="btn-send"><svg width="22" height="22" id="send-icon"><use href="#i-mic"/></svg></button>
    </div>
  </section>
</div>

<div class="overlay" id="sheet-overlay"><div class="sheet" id="sheet-content"></div></div>
<div class="overlay" id="emoji-overlay"><div class="sheet" id="emoji-panel"></div></div>
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>
<div id="toast"></div>

<script src="script.js" defer></script>
</body>
</html>
