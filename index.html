<div id="app">
  <section class="screen" id="screen-list">
    <header class="hdr">
      <button class="icon-btn" id="btn-menu-list">
        <svg width="22" height="22"><use href="#i-menu"/></svg>
      </button>
      <div class="hdr-title" id="list-title">
        <span class="logo-wrap"><span class="logo-text">پیسفون</span></span>
      </div>
      <button class="icon-btn" id="btn-search-toggle">
        <svg width="22" height="22"><use href="#i-search"/></svg>
      </button>
      <button class="icon-btn" id="btn-new-chat">
        <svg width="22" height="22"><use href="#i-new-chat"/></svg>
      </button>
    </header>

    <div class="tab-body" id="tab-chats">
      <div class="searchbar" id="searchbar" style="display:none">
        <input id="search-input" placeholder="جستجوی چت، پیام یا آیدی…">
        <button class="search-clear" id="search-clear">✕</button>
      </div>

      <nav class="top-nav" id="top-nav">
        <button class="tnav-item active" data-filter="all">همه</button>
        <button class="tnav-item" data-filter="private">خصوصی</button>
        <button class="tnav-item" data-filter="group">گروه</button>
        <button class="tnav-item" data-filter="channel">کانال</button>
        <button class="tnav-item" data-filter="ai">هوش مصنوعی</button>
        <button class="tnav-item" data-filter="saved">ذخیره‌شده</button>
        <button class="tnav-item" data-filter="discover">کشف</button>
      </nav>

      <div class="list" id="chat-list"></div>
    </div>

    <div class="tab-body hidden" id="tab-contacts">
      <div class="list" id="contacts-list"></div>
    </div>

    <div class="tab-body hidden" id="tab-settings">
      <div id="settings-body"></div>
    </div>
  </section>

  <section class="screen" id="screen-chat">
    <header class="hdr">
      <button class="icon-btn back-btn" id="btn-back">
        <svg width="24" height="24"><use href="#i-back"/></svg>
      </button>
      <div class="avatar sm" id="chat-avatar"></div>
      <div class="chat-info">
        <div class="hdr-title" id="chat-name"></div>
        <div id="chat-status"></div>
      </div>
      <button class="icon-btn" id="btn-search-msg">
        <svg width="20" height="20"><use href="#i-search"/></svg>
      </button>
      <button class="icon-btn" id="btn-chat-menu">
        <svg width="20" height="20"><use href="#i-menu"/></svg>
      </button>
    </header>

    <div class="msg-search-bar" id="msg-search-bar">
      <input id="msg-search-input" placeholder="جستجو در پیام‌های این چت…">
      <span class="msg-search-count" id="msg-search-count"></span>
      <button class="icon-btn" id="msg-search-prev"><svg width="16" height="16" style="transform:scaleX(-1)"><use href="#i-chevron"/></svg></button>
      <button class="icon-btn" id="msg-search-next"><svg width="16" height="16"><use href="#i-chevron"/></svg></button>
      <button class="icon-btn" id="msg-search-close"><svg width="18" height="18"><use href="#i-close"/></svg></button>
    </div>

    <div id="messages"></div>

    <button class="scroll-bottom-btn" id="btn-scroll-bottom" style="display:none">
      <svg width="20" height="20"><use href="#i-arrow-down"/></svg>
      <span class="unread-badge" id="scroll-unread" style="display:none">0</span>
    </button>

    <div class="reply-bar" id="reply-bar">
      <div class="rb-bar"></div>
      <div class="rb-body">
        <div class="rb-name" id="rb-name"></div>
        <div class="rb-text" id="rb-text"></div>
      </div>
      <button class="icon-btn" id="rb-close">
        <svg width="16" height="16"><use href="#i-close"/></svg>
      </button>
    </div>

    <div class="rec-bar" id="rec-bar">
      <span class="rec-dot"></span>
      <span id="rec-time">0:00</span>
      <span class="rec-cancel" id="rec-cancel">برای لغو بکشید</span>
    </div>

    <div class="composer" id="composer">
      <button class="icon-btn" id="btn-attach">
        <svg width="22" height="22"><use href="#i-attach"/></svg>
      </button>
      <div class="input-wrap">
        <textarea id="msg-input" rows="1" placeholder="پیام"></textarea>
      </div>
      <button class="icon-btn" id="btn-emoji">
        <svg width="22" height="22"><use href="#i-smile"/></svg>
      </button>
      <button class="send-btn" id="btn-send">
        <svg width="20" height="20"><use href="#i-mic"/></svg>
      </button>
    </div>
  </section>

  <section class="screen" id="screen-info">
    <header class="hdr">
      <button class="icon-btn back-btn" id="btn-info-back">
        <svg width="24" height="24"><use href="#i-back"/></svg>
      </button>
      <div class="hdr-title" id="info-title">اطلاعات</div>
      <button class="icon-btn" id="btn-info-edit">
        <svg width="22" height="22"><use href="#i-edit"/></svg>
      </button>
    </header>
    <div class="info-body" id="info-body"></div>
  </section>

  <section class="screen" id="screen-profile">
    <header class="hdr">
      <button class="icon-btn back-btn" id="btn-profile-back">
        <svg width="24" height="24"><use href="#i-back"/></svg>
      </button>
      <div class="hdr-title">پیش‌نمایش</div>
      <div style="width:38px"></div>
    </header>
    <div class="info-body" id="profile-body"></div>
  </section>
</div>

<nav class="bottom-nav" id="bottom-nav">
  <button class="bnav-item" data-tab="contacts">
    <span class="bnav-icon">
      <svg width="24" height="24"><use href="#i-users-outline"/></svg>
    </span>
    <span class="bnav-label">مخاطبین</span>
  </button>
  <button class="bnav-item active" data-tab="chats">
    <span class="bnav-icon">
      <svg width="24" height="24"><use href="#i-chat-fill"/></svg>
    </span>
    <span class="bnav-label">گفتگوها</span>
  </button>
  <button class="bnav-item" data-tab="settings">
    <span class="bnav-icon">
      <svg width="24" height="24"><use href="#i-settings-outline"/></svg>
    </span>
    <span class="bnav-label">تنظیمات</span>
  </button>
</nav>

<div class="overlay" id="sheet-overlay"><div class="sheet" id="sheet-content"></div></div>
<div class="overlay" id="emoji-overlay"><div class="sheet" id="emoji-panel"></div></div>
<div class="overlay" id="avatar-overlay"><div class="sheet" id="avatar-panel"></div></div>
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>

<div class="update-overlay" id="update-overlay">
  <div class="update-box">
    <div class="update-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l1.6 4.8L18 8.4l-4.4 1.6L12 15l-1.6-5L6 8.4l4.4-1.6L12 2z"/>
      </svg>
    </div>
    <div class="update-badge">بروزرسانی</div>
    <div class="update-version" id="update-version">10.20</div>
    <div class="update-title">نسخه جدید اعمال شد 🎉</div>
    <div class="update-sub">تغییرات این نسخه:</div>
    <div class="update-changelog" id="update-changelog"></div>
    <button class="update-ok" id="update-ok">👍 متوجه شدم</button>
  </div>
</div>

<div id="toast"></div>

<script src="script.js" defer></script>
</body>
</html>
